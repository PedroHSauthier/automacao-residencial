      {% elif agenda_acao == 'suspend' %}Suspenso pela agenda
      {% elif agenda_acao == 'power_off_block' %}Desligado e bloqueado pela agenda
      {% elif agenda_acao == 'power_off' %}
        {% set processado = state_attr('sensor.elgin_supervisor_politica_temporal_efetiva','desligamento_unico_processado') | bool(false) %}
