    icon: mdi:tune-variant
    state: "{{ states('sensor.elgin_supervisor_tratamento_desejado') }}"
    attributes:
      potencia: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ states('input_select.elgin_supervisor_potencia_fisica_classificada') }}{% else %}{{ state_attr('sensor.elgin_supervisor_potencias','profile_in_use') or 'Desativado' }}{% endif %}
      profile_id: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','profile_id') }}{% else %}{{ state_attr('sensor.elgin_supervisor_potencias','profile_in_use_id') }}{% endif %}
      mode: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','mode') }}{% else %}{{ {'Aquecimento':'heat','Refrigeração':'cool','Desumidificação':'dry'}.get(states('sensor.elgin_supervisor_tratamento_desejado'),'off') }}{% endif %}
      target_temperature: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','target_temperature') | float(24) | round(0) | int }}{% else %}{{ state_attr('sensor.elgin_supervisor_potencias','target_temperature_in_use') if states('sensor.elgin_supervisor_tratamento_desejado') != 'Nenhum' else 'Não aplicável' }}{% endif %}
      fan: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','fan') }}
        {% elif states('sensor.elgin_supervisor_tratamento_desejado') == 'Nenhum' %}Não aplicável
        {% elif is_state('binary_sensor.elgin_supervisor_turbo_efetivo','on') %}high
        {% else %}
          {% set tr = states('sensor.elgin_supervisor_tratamento_desejado') %}{% set mode = {'Aquecimento':'heat','Refrigeração':'cool','Desumidificação':'dry'}.get(tr,'') %}
          {% set agenda = (state_attr('sensor.elgin_supervisor_agenda_politica','fan') or {}).get(mode) %}
          {{ ('low' if agenda == 'quiet' else agenda) if agenda in ['auto','low','medium','high','quiet'] else state_attr('sensor.elgin_supervisor_potencias','fan_in_use') }}
        {% endif %}
      swing: |-
        {% if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') %}{{ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado') }}{% else %}{% set tr = states('sensor.elgin_supervisor_tratamento_desejado') %}{% set mode = {'Aquecimento':'heat','Refrigeração':'cool','Desumidificação':'dry'}.get(tr) %}{% set ag = (state_attr('sensor.elgin_supervisor_agenda_politica','swing') or {}).get(mode) if mode else none %}{{ states('sensor.elgin_supervisor_swing_automatico') if ag in [none,'','auto','default'] else ag }}{% endif %}
