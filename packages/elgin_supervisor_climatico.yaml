        {{ states('sensor.elgin_supervisor_tratamento_desejado') }}
      ativo: |-
        {{ states('input_select.elgin_supervisor_tratamento_ativo') }}
      fisico: |-
        {{ states('sensor.elgin_supervisor_estado_fisico_observado') }}
      fisico_semiautomatico: |-
        {{ states('sensor.elgin_supervisor_estado_fisico_semiautomatico') }}
