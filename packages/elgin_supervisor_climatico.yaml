  - name: Elgin Supervisor - Classificação do estado físico
    unique_id: elgin_supervisor_v4_classificacao_estado_fisico
    default_entity_id: sensor.elgin_supervisor_classificacao_do_estado_fisico
    icon: mdi:remote
    state: |-
      {% set power = is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on') %}
      {% set mode_raw = states('select.smart_air_conditioner_mode_ar_condicionado_id_4') %}
      {% set mode = {'Frio':'cool','Quente':'heat','Desumidificar':'dry','Ventilar':'fan','Automático':'auto'}.get(mode_raw,'unknown') %}
      {% set fan_raw = states('select.smart_air_conditioner_windspeed_ar_condicionado_id_5') %}
      {% set fan = {'Baixa':'low','Média':'medium','Alta':'high','Automática':'auto','Silencioso':'quiet'}.get(fan_raw,'unknown') %}
      {% set alvo_raw = states('number.smart_air_conditioner_temperatura_alvo_ar_condicionado_id_2') %}
      {% set alvo = (alvo_raw | float(240) / 10) | round(1) %}
      {% set profiles = (state_attr('sensor.elgin_supervisor_potencias','profiles') or {}).get(mode,[]) %}
      {% set ns = namespace(name='Nenhuma',id=none,fan='unknown',target=0,score=999999) %}
      {% for profile in profiles if profile.enabled | default(true) %}
        {% if fan == profile.fan %}{% set fan_penalty = 0 %}
        {% elif fan == 'quiet' and profile.fan == 'low' %}{% set fan_penalty = 0.25 %}
        {% elif fan == 'auto' %}{% set fan_penalty = 2 %}
        {% else %}{% set fan_penalty = 1 %}{% endif %}
        {% set score = fan_penalty * 1000 + ((alvo - profile.target_temperature) | abs) * 10 + (profile.level | int(0)) %}
        {% if score < ns.score %}
          {% set ns.name = profile.name %}{% set ns.id = profile.id %}{% set ns.fan = profile.fan %}{% set ns.target = profile.target_temperature %}{% set ns.score = score %}
        {% endif %}
      {% endfor %}
      {% if not power %}Nenhuma{% elif mode not in ['heat','cool','dry'] %}Não supervisionado{% elif ns.id is none %}Sem perfil habilitado{% else %}{{ ns.name }}{% endif %}
    attributes:
      power: "{{ is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on') }}"
      mode: |-
        {{ {'Frio':'cool','Quente':'heat','Desumidificar':'dry','Ventilar':'fan','Automático':'auto'}.get(states('select.smart_air_conditioner_mode_ar_condicionado_id_4'),'unknown') }}
      fan: |-
        {{ {'Baixa':'low','Média':'medium','Alta':'high','Automática':'auto','Silencioso':'quiet'}.get(states('select.smart_air_conditioner_windspeed_ar_condicionado_id_5'),'unknown') }}
      target_temperature: |-
        {{ (states('number.smart_air_conditioner_temperatura_alvo_ar_condicionado_id_2') | float(240) / 10) | round(1) }}
      profile_id: |-
        {% set mode = {'Frio':'cool','Quente':'heat','Desumidificar':'dry'}.get(states('select.smart_air_conditioner_mode_ar_condicionado_id_4'),'unknown') %}
        {% set fan = {'Baixa':'low','Média':'medium','Alta':'high','Automática':'auto','Silencioso':'quiet'}.get(states('select.smart_air_conditioner_windspeed_ar_condicionado_id_5'),'unknown') %}
        {% set alvo = (states('number.smart_air_conditioner_temperatura_alvo_ar_condicionado_id_2') | float(240) / 10) | round(1) %}
        {% set profiles = (state_attr('sensor.elgin_supervisor_potencias','profiles') or {}).get(mode,[]) %}
        {% set ns = namespace(id=none,score=999999) %}
        {% for profile in profiles if profile.enabled | default(true) %}
          {% set fp = 0 if fan == profile.fan else 0.25 if fan == 'quiet' and profile.fan == 'low' else 2 if fan == 'auto' else 1 %}
          {% set score = fp * 1000 + ((alvo - profile.target_temperature) | abs) * 10 + (profile.level | int(0)) %}
          {% if score < ns.score %}{% set ns.id=profile.id %}{% set ns.score=score %}{% endif %}
        {% endfor %}{{ ns.id }}
      catalog_source: sensor.elgin_supervisor_potencias
