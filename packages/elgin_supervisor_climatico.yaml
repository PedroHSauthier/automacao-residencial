- id: elgin_supervisor_v2_inicializar_limites
  alias: Elgin Supervisor - Inicializar presets e limites internos
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: "00:00:10"
  - condition: state
    entity_id: input_boolean.elgin_supervisor_limites_v2_configurados
    state: "off"
  - variables:
      atuais:
        input_number.elgin_supervisor_auto_aquecimento_inicio: |-
          {{ states('input_number.elgin_supervisor_aquecimento_inicio') | float(18.0) }}
        input_number.elgin_supervisor_auto_aquecimento_fim: |-
          {{ states('input_number.elgin_supervisor_aquecimento_fim') | float(20.2) }}
        input_number.elgin_supervisor_auto_refrigeracao_inicio: |-
          {{ states('input_number.elgin_supervisor_refrigeracao_inicio') | float(25.2) }}
        input_number.elgin_supervisor_auto_refrigeracao_fim: |-
          {{ states('input_number.elgin_supervisor_refrigeracao_fim') | float(22.7) }}
        input_number.elgin_supervisor_auto_desumidificacao_inicio: |-
          {{ states('input_number.elgin_supervisor_desumidificacao_inicio') | float(63) }}
        input_number.elgin_supervisor_auto_desumidificacao_fim: |-
          {{ states('input_number.elgin_supervisor_desumidificacao_fim') | float(57) }}
        input_number.elgin_supervisor_auto_desumidificacao_temperatura_minima: |-
          {{ states('input_number.elgin_supervisor_desumidificacao_temperatura_minima') | float(19.0) }}
      preset_aquecimento_inicial: |-
        {% set v = [
          states('input_number.elgin_supervisor_aquecimento_inicio') | float(0),
          states('input_number.elgin_supervisor_aquecimento_fim') | float(0)
        ] %}
        {% set mapa = {
          'Economia':[16.5,19.0],
          'Equilíbrio':[18.0,20.2],
          'Conforto':[19.5,21.3],
          'Agressivo':[21.0,22.5]
        } %}
        {% set ns = namespace(resultado='Personalizado') %}
        {% for nome, valores in mapa.items() %}
          {% if v == valores %}{% set ns.resultado = nome %}{% endif %}
        {% endfor %}
        {{ ns.resultado }}
      preset_refrigeracao_inicial: |-
        {% set v = [
          states('input_number.elgin_supervisor_refrigeracao_inicio') | float(0),
          states('input_number.elgin_supervisor_refrigeracao_fim') | float(0)
        ] %}
        {% set mapa = {
          'Economia':[26.0,23.0],
          'Equilíbrio':[25.2,22.7],
          'Conforto':[24.3,22.3],
          'Agressivo':[23.5,22.0]
        } %}
        {% set ns = namespace(resultado='Personalizado') %}
        {% for nome, valores in mapa.items() %}
          {% if v == valores %}{% set ns.resultado = nome %}{% endif %}
        {% endfor %}
        {{ ns.resultado }}
      preset_desumidificacao_inicial: |-
        {% set v = [
          states('input_number.elgin_supervisor_desumidificacao_inicio') | float(0),
          states('input_number.elgin_supervisor_desumidificacao_fim') | float(0),
          states('input_number.elgin_supervisor_desumidificacao_temperatura_minima') | float(0)
        ] %}
        {% set mapa = {
          'Economia':[65.0,60.0,20.0],
          'Equilíbrio':[63.0,57.0,19.0],
          'Conforto':[61.0,54.0,18.0],
          'Agressivo':[60.0,52.0,17.5]
        } %}
        {% set ns = namespace(resultado='Personalizado') %}
        {% for nome, valores in mapa.items() %}
          {% if v == valores %}{% set ns.resultado = nome %}{% endif %}
        {% endfor %}
        {{ ns.resultado }}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.elgin_supervisor_aplicando_preset_histerese
  - repeat:
      for_each: "{{ atuais | dictsort }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: "{{ repeat.item[0] }}"
        data:
          value: "{{ repeat.item[1] }}"
  - action: input_select.select_option
    target:
      entity_id: input_select.elgin_supervisor_preset_aquecimento
    data:
      option: |-
        {{ preset_aquecimento_inicial }}
  - action: input_select.select_option
    target:
      entity_id: input_select.elgin_supervisor_preset_refrigeracao
    data:
      option: |-
        {{ preset_refrigeracao_inicial }}
  - action: input_select.select_option
    target:
      entity_id: input_select.elgin_supervisor_preset_desumidificacao
    data:
      option: |-
        {{ preset_desumidificacao_inicial }}
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.elgin_supervisor_usar_limites_automaticos
      - input_boolean.elgin_supervisor_aplicando_preset_histerese
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.elgin_supervisor_limites_v2_configurados
  mode: single
