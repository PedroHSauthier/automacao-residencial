template:
- binary_sensor:
  - name: Elgin Supervisor - Clima regional efetivo
    unique_id: elgin_supervisor_v7_clima_regional_efetivo
    default_entity_id: binary_sensor.elgin_supervisor_clima_regional_efetivo
    icon: mdi:weather-partly-cloudy
    state: |
      {% set ag = state_attr('sensor.elgin_supervisor_agenda_politica','regional') | default('default', true) %}
      {{ ag == 'on' or (ag not in ['on','off'] and is_state('input_boolean.elgin_supervisor_usar_clima_regional','on')) }}
    attributes:
      fonte: |
        {% set ag = state_attr('sensor.elgin_supervisor_agenda_politica','regional') | default('default', true) %}
        {% if ag in ['on','off'] %}Agenda — {{ ag }}
        {% else %}Manual — {{ states('input_boolean.elgin_supervisor_usar_clima_regional') }}{% endif %}
      valor_agenda: |
        {{ state_attr('sensor.elgin_supervisor_agenda_politica','regional') | default('default', true) }}
      valor_manual: |
        {{ states('input_boolean.elgin_supervisor_usar_clima_regional') }}
      regra_origem: |
        {% set src = state_attr('sensor.elgin_supervisor_agenda_politica','effect_sources') or {} %}
        {{ (src.get('regional') or {}).get('rule','Configuração manual') }}
      prioridade_origem: |
        {% set src = state_attr('sensor.elgin_supervisor_agenda_politica','effect_sources') or {} %}
