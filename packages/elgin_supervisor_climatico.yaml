          entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
        data:
          value: Supervisor habilitado durante sincronização passiva; a classificação ocorrerá automaticamente ao 
            concluir.
    - stop: Estado físico encaminhado para adoção ao habilitar o Supervisor.
  - delay: 00:00:01
  - action: script.elgin_supervisor_aplicar_decisao
  mode: restart
- id: elgin_supervisor_v4_power_off_prioritario
  alias: Elgin Supervisor - Power OFF prioritário
  description: Qualquer confirmação LocalTuya de Power OFF encerra imediatamente o ciclo interno, mesmo durante 
    reconciliação ou classificação.
  triggers:
  - trigger: state
    entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
    to: 'off'
  conditions:
  - condition: template
    value_template: |-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state not in ['unknown','unavailable']
         and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - action: script.elgin_supervisor_encerrar_ciclo_por_power_off_observado
    data:
      origem: |-
        {{ trigger.entity_id }}
  mode: restart
- id: elgin_supervisor_v1_observar_localtuya
  alias: Elgin Supervisor - Observar estado físico LocalTuya
  triggers:
  - trigger: state
    entity_id:
    - switch.smart_air_conditioner_power_ar_condicionado_id_1
    - select.smart_air_conditioner_mode_ar_condicionado_id_4
    - select.smart_air_conditioner_windspeed_ar_condicionado_id_5
    - number.smart_air_conditioner_temperatura_alvo_ar_condicionado_id_2
    - switch.smart_air_conditioner_swing_ar_condicionado_id_33
    - switch.smart_air_conditioner_up_down_wind_ar_condicionado_id_105
    - switch.smart_air_conditioner_sleep_ar_condicionado_id_102
    - switch.smart_air_conditioner_health_ar_condicionado_id_106
  conditions:
  - condition: template
    value_template: |-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state not in ['unknown','unavailable']
         and trigger.to_state.state not in ['unknown','unavailable']
         and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - if:
    - condition: template
      value_template: |-
        {{ trigger.entity_id == 'switch.smart_air_conditioner_power_ar_condicionado_id_1' }}
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.elgin_supervisor_ultima_mudanca_power
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
  - if:
    - condition: template
      value_template: |-
        {{ not (
          trigger.entity_id == 'switch.smart_air_conditioner_power_ar_condicionado_id_1'
          and trigger.to_state is not none
          and trigger.to_state.state == 'off'
        ) }}
    - condition: state
      entity_id: input_boolean.elgin_supervisor_habilitado
      state: 'on'
    - condition: template
      value_template: >-
        {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) != 'disable_supervisor'
        }}
    - condition: state
      entity_id: timer.elgin_supervisor_janela_reconciliacao
      state: idle
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_assinatura_ultimo_ir
      data:
        value: ''
    - choose:
      - conditions:
        - condition: state
          entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
          state: 'on'
        sequence:
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
          data:
            value: |-
              {{ ('Mudança detectada em ' ~ trigger.entity_id ~ '; aguardando a sincronização passiva consolidar o estado LocalTuya.') | truncate(255, true, '') }}
      - conditions:
        - condition: state
          entity_id: binary_sensor.elgin_supervisor_respeitar_controle_manual_efetivo
          state: 'on'
        sequence:
        - action: timer.start
          target:
            entity_id: timer.elgin_supervisor_pausa_manual
          data:
            duration: |-
              {% set m = state_attr('sensor.elgin_supervisor_tempos_efetivos','pausa_manual') | int(30) %}
              {{ '%02d:%02d:00' | format(m // 60, m % 60) }}
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_ativo
          data:
            option: Manual
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_decisao
          data:
            value: |-
              Alteração física detectada em {{ trigger.entity_id }}. Automação pausada para respeitar o controle manual.
      default:
      - action: script.elgin_supervisor_aplicar_decisao
  mode: restart
  description: Registra mudanças LocalTuya. Power OFF é tratado separadamente pela automação prioritária; demais 
    mudanças seguem a classificação após a sincronização passiva.
- id: elgin_supervisor_v3_inicializar_presets_potencia
  alias: Elgin Supervisor - Inicializar presets e potência V3
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:08
  - if:
    - condition: state
      entity_id: input_boolean.elgin_supervisor_presets_potencia_v3_configurados
      state: 'off'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_temperatura_na_ativacao
      data:
        value: |-
          {{ states('sensor.sensor_temperatura_sensor_dedicado') | float(20) | round(1) }}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_umidade_na_ativacao
      data:
        value: |-
          {{ states('sensor.sensor_umidade_sensor_dedicado') | float(50) | round(0) | int }}
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.elgin_supervisor_inicio_do_ciclo
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
    - action: script.elgin_supervisor_aplicar_preset_histerese
      data:
        modo: Todos
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.elgin_supervisor_presets_potencia_v3_configurados
  mode: single
- id: elgin_supervisor_v4_classificar_apos_sincronizacao_localtuya
  alias: Elgin Supervisor - Classificar após sincronização LocalTuya
  description: Após a importação passiva, trata Power OFF com prioridade absoluta. Demais estados são classificados 
    somente fora da reconciliação.
  triggers:
  - trigger: state
    entity_id: input_boolean.elgin_aux_sincronizacao_passiva_em_andamento
    from: 'on'
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.elgin_supervisor_habilitado
    state: 'on'
  - condition: template
    value_template: >-
      {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) != 'disable_supervisor'
      }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
        state: 'off'
      sequence:
      - action: script.elgin_supervisor_encerrar_ciclo_por_power_off_observado
        data:
          origem: fim da sincronização passiva LocalTuya
    - conditions:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
        state: 'on'
      - condition: state
        entity_id: timer.elgin_supervisor_janela_reconciliacao
        state: idle
      sequence:
      - delay: 00:00:01
      - action: script.elgin_supervisor_adotar_estado_fisico
    default:
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
      data:
        value: 'Sincronização concluída durante reconciliação: confirmação mantida sem reclassificação. Power OFF continuaria
          sendo prioritário.'
  mode: restart
- id: elgin_supervisor_v4_finalizar_classificacao_fisica
  alias: Elgin Supervisor - Finalizar classificação física
  description: Limpeza final executada quando o script de adoção termina, inclusive após interrupção ou erro.
  triggers:
  - trigger: state
    entity_id: script.elgin_supervisor_adotar_estado_fisico
    from: 'on'
    to: 'off'
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.elgin_supervisor_classificacao_fisica
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
  - delay: 00:00:01
  - if:
    - condition: state
      entity_id: input_boolean.elgin_supervisor_habilitado
      state: 'on'
    - condition: state
      entity_id: input_boolean.elgin_aux_sincronizacao_passiva_em_andamento
      state: 'off'
    then:
    - action: script.elgin_supervisor_aplicar_decisao
  mode: restart
- id: elgin_supervisor_v4_watchdog_classificacao_fisica
  alias: Elgin Supervisor - Watchdog da classificação física
  description: Libera automaticamente uma classificação que exceda 15 segundos.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.elgin_supervisor_classificacao_fisica
  actions:
  - action: script.turn_off
    continue_on_error: true
    target:
      entity_id: script.elgin_supervisor_adotar_estado_fisico
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
  - action: input_text.set_value
    target:
      entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
    data:
      value: 'Watchdog: classificação física excedeu 15 segundos e foi liberada automaticamente. Verifique o rastreamento
        do script de adoção.'
  mode: restart
- id: elgin_supervisor_v4_alternar_fisico_semiautomatico
  alias: Elgin Supervisor - Alternar físico semi-automático
  triggers:
  - trigger: state
    entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
  conditions:
  - condition: template
    value_template: |-
      {{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
        state: 'on'
      sequence:
      - action: timer.cancel
        target:
          entity_id:
          - timer.elgin_supervisor_pausa_manual
          - timer.elgin_supervisor_classificacao_fisica
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
      - if:
        - condition: state
          entity_id: input_boolean.elgin_supervisor_habilitado
          state: 'on'
        - condition: template
          value_template: >-
            {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) != 'disable_supervisor'
            }}
        then:
        - delay: 00:00:01
        - if:
          - condition: state
            entity_id: input_boolean.elgin_aux_sincronizacao_passiva_em_andamento
            state: 'off'
          then:
          - action: script.elgin_supervisor_adotar_estado_fisico
          else:
          - action: input_text.set_value
            target:
              entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
            data:
              value: Físico semi-automático ativado; aguardando concluir a sincronização passiva.
    default:
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_classificacao_fisica
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.elgin_supervisor_estado_fisico_adotado
        - input_boolean.elgin_supervisor_processando_comando_fisico
    - action: input_select.select_option
      target:
        entity_id: input_select.elgin_supervisor_tratamento_fisico_classificado
      data:
        option: Nenhum
    - action: input_select.select_option
      target:
        entity_id:
        - input_select.elgin_supervisor_potencia_fisica_classificada
        - input_select.elgin_supervisor_potencia_supervisor_na_adocao
      data:
        option: Nenhuma
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.elgin_supervisor_habilitado
          state: 'on'
        - condition: state
          entity_id: binary_sensor.elgin_supervisor_respeitar_controle_manual_efetivo
          state: 'on'
        - condition: state
          entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
          state: 'on'
        sequence:
        - action: timer.start
          target:
            entity_id: timer.elgin_supervisor_pausa_manual
          data:
            duration: |-
              {% set m = state_attr('sensor.elgin_supervisor_tempos_efetivos','pausa_manual') | int(30) %}
              {{ '%02d:%02d:00' | format(m // 60, m % 60) }}
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_ativo
          data:
            option: Manual
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_decisao
          data:
            value: Físico semi-automático desativado; estado atual voltou ao tratamento manual com pausa.
      default:
      - action: script.elgin_supervisor_aplicar_decisao
  mode: restart
- id: elgin_supervisor_v4_restaurar_fisico_semiautomatico
  alias: Elgin Supervisor - Restaurar físico semi-automático
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:12
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
        state: 'off'
      sequence:
      - action: script.elgin_supervisor_encerrar_ciclo_por_power_off_observado
        data:
          origem: restauração após reinício
      - stop: Power OFF restaurado; ciclo interno limpo.
  - action: timer.cancel
    target:
      entity_id: timer.elgin_supervisor_classificacao_fisica
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
        state: 'on'
      - condition: state
        entity_id: input_boolean.elgin_supervisor_habilitado
        state: 'on'
      - condition: template
        value_template: >-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) != 'disable_supervisor'
          }}
      - condition: state
        entity_id: input_boolean.elgin_aux_sincronizacao_passiva_em_andamento
        state: 'off'
      sequence:
      - action: script.elgin_supervisor_adotar_estado_fisico
    - conditions:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
        state: 'off'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elgin_supervisor_estado_fisico_adotado
  mode: single

- id: elgin_supervisor_agenda_reavaliar_politica
  alias: Elgin Supervisor - Reavaliar após mudança da agenda
  description: Reaplica a decisão e as funções exclusivas do LocalTuya quando a política temporal muda.
  triggers:
  - trigger: state
    entity_id: sensor.elgin_supervisor_agenda_politica
  - trigger: event
    event_type: elgin_supervisor_agenda_policy_changed
  actions:
  - action: script.elgin_supervisor_atualizar_condicoes_regionais
    continue_on_error: true
  - if:
    - condition: template
      value_template: >-
        {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) == 'disable_supervisor'
        }}
    then:
    - action: script.turn_off
      continue_on_error: true
      target:
        entity_id: script.elgin_supervisor_adotar_estado_fisico
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_classificacao_fisica
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.elgin_supervisor_processando_comando_fisico
        - input_boolean.elgin_supervisor_estado_fisico_adotado
  - if:
    - condition: template
      value_template: |-
        {{ state_attr('sensor.elgin_supervisor_agenda_politica','cancel_manual_pause') | default(false, true) }}
    then:
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_pausa_manual
  - delay: 00:00:01
  - action: script.elgin_supervisor_aplicar_decisao
  mode: restart

- id: elgin_supervisor_reconciliar_eco_quando_necessario
  alias: Elgin Supervisor - Reconciliar Eco após estado físico estável
  description: >
    Centraliza o único comando Eco possível. Aguarda Power e modo LocalTuya
    estabilizarem; somente Frio pode gerar switch.turn_on ou switch.turn_off.
  triggers:
  - trigger: state
    entity_id: binary_sensor.elgin_supervisor_eco_efetivo
  - trigger: state
    entity_id: input_boolean.elgin_supervisor_usar_eco
  - trigger: state
    entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
    to: 'on'
  - trigger: state
    entity_id: select.smart_air_conditioner_mode_ar_condicionado_id_4
  - trigger: state
    entity_id: sensor.elgin_supervisor_agenda_politica
  actions:
  - delay: 00:00:04
  - condition: state
    entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
    state: 'on'
  - condition: state
    entity_id: select.smart_air_conditioner_mode_ar_condicionado_id_4
    state: Frio
  - condition: template
    value_template: >-
      {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) == 'normal' }}
  - action: script.elgin_supervisor_reconciliar_eco
    continue_on_error: true
    data:
      motivo: Estado LocalTuya confirmado em refrigeração
  mode: restart
