  - name: Elgin Supervisor - Tempo mínimo ligado restante
    unique_id: elgin_supervisor_v6_tempo_minimo_ligado_restante
    default_entity_id: sensor.elgin_supervisor_tempo_minimo_ligado_restante
    icon: mdi:timer-lock
    state: |-
      {% set power = is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on') %}
      {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_ligado') | float(0) * 60 %}
      {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
      {% set restante = [configurado - (as_timestamp(now()) - ultima), 0] | max %}
      {% if power and restante > 0 %}
        {{ (restante / 60) | round(1) }} min
      {% else %}
        Inativo
      {% endif %}
    attributes:
      ativo: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_ligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {{ is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on')
           and configurado - (as_timestamp(now()) - ultima) > 0 }}
      segundos_restantes: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_ligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {% set restante = [configurado - (as_timestamp(now()) - ultima), 0] | max %}
        {{ restante | round(0) | int
           if is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on')
           else 0 }}
      configurado_minutos: |-
        {{ states('input_number.elgin_supervisor_tempo_minimo_ligado') }}
      termina_em: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_ligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {% set fim = ultima + configurado %}
        {{ as_datetime(fim).isoformat()
           if is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on')
              and fim > as_timestamp(now())
           else none }}
  - name: Elgin Supervisor - Tempo mínimo desligado restante
    unique_id: elgin_supervisor_v6_tempo_minimo_desligado_restante
    default_entity_id: sensor.elgin_supervisor_tempo_minimo_desligado_restante
    icon: mdi:timer-lock-outline
    state: |-
      {% set power_off = is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','off') %}
      {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_desligado') | float(0) * 60 %}
      {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
      {% set restante = [configurado - (as_timestamp(now()) - ultima), 0] | max %}
      {% if power_off and restante > 0 %}
        {{ (restante / 60) | round(1) }} min
      {% else %}
        Inativo
      {% endif %}
    attributes:
      ativo: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_desligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {{ is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','off')
           and configurado - (as_timestamp(now()) - ultima) > 0 }}
      segundos_restantes: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_desligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {% set restante = [configurado - (as_timestamp(now()) - ultima), 0] | max %}
        {{ restante | round(0) | int
           if is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','off')
           else 0 }}
      configurado_minutos: |-
        {{ states('input_number.elgin_supervisor_tempo_minimo_desligado') }}
      termina_em: |-
        {% set configurado = states('input_number.elgin_supervisor_tempo_minimo_desligado') | float(0) * 60 %}
        {% set ultima = as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
        {% set fim = ultima + configurado %}
        {{ as_datetime(fim).isoformat()
           if is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','off')
              and fim > as_timestamp(now())
           else none }}
  - name: Elgin Supervisor - Duração do ciclo atual
    unique_id: elgin_supervisor_v6_duracao_ciclo_atual
    default_entity_id: sensor.elgin_supervisor_duracao_do_ciclo_atual
    icon: mdi:progress-clock
    state: |-
      {% set tratamento = states('input_select.elgin_supervisor_tratamento_ativo') %}
      {% set inicio = as_timestamp(states('input_datetime.elgin_supervisor_inicio_do_ciclo'),0) %}
      {% set segundos = [as_timestamp(now()) - inicio, 0] | max %}
      {% if tratamento in ['Aquecimento','Refrigeração','Desumidificação']
            and inicio > 0 %}
        {% set horas = (segundos // 3600) | int %}
        {% set minutos = ((segundos % 3600) // 60) | int %}
        {% if horas > 0 %}{{ horas }} h {{ minutos }} min
        {% else %}{{ minutos }} min{% endif %}
      {% else %}
        Inativo
      {% endif %}
    attributes:
      tratamento: |-
        {{ states('input_select.elgin_supervisor_tratamento_ativo') }}
      inicio: |-
        {{ states('input_datetime.elgin_supervisor_inicio_do_ciclo') }}
      segundos: |-
        {% set inicio = as_timestamp(states('input_datetime.elgin_supervisor_inicio_do_ciclo'),0) %}
        {{ ([as_timestamp(now()) - inicio, 0] | max) | round(0) | int if inicio > 0 else 0 }}
      temperatura_na_ativacao: |-
        {{ states('input_number.elgin_supervisor_temperatura_na_ativacao') }}
      umidade_na_ativacao: |-
        {{ states('input_number.elgin_supervisor_umidade_na_ativacao') }}
  - name: Elgin Supervisor - Proteção temporal atual
    unique_id: elgin_supervisor_v6_protecao_temporal_atual
    default_entity_id: sensor.elgin_supervisor_protecao_temporal_atual
    icon: mdi:shield-clock
    state: |-
      {% if state_attr('sensor.elgin_supervisor_tempo_minimo_ligado_restante','ativo') %}
        Mínimo ligado · {{ states('sensor.elgin_supervisor_tempo_minimo_ligado_restante') }}
      {% elif state_attr('sensor.elgin_supervisor_tempo_minimo_desligado_restante','ativo') %}
        Mínimo desligado · {{ states('sensor.elgin_supervisor_tempo_minimo_desligado_restante') }}
      {% elif is_state('timer.elgin_supervisor_pausa_manual','active') %}
        Pausa manual · {{ state_attr('timer.elgin_supervisor_pausa_manual','remaining') }}
      {% elif is_state('timer.elgin_supervisor_protecao_troca_modo','active') %}
        Troca de modo · {{ state_attr('timer.elgin_supervisor_protecao_troca_modo','remaining') }}
      {% elif is_state('timer.elgin_supervisor_janela_reconciliacao','active') %}
        Reconciliação · {{ state_attr('timer.elgin_supervisor_janela_reconciliacao','remaining') }}
      {% elif is_state('timer.elgin_supervisor_classificacao_fisica','active') %}
        Classificação · {{ state_attr('timer.elgin_supervisor_classificacao_fisica','remaining') }}
      {% else %}
        Livre
      {% endif %}
    attributes:
      minimo_ligado: |-
        {{ states('sensor.elgin_supervisor_tempo_minimo_ligado_restante') }}
      minimo_desligado: |-
        {{ states('sensor.elgin_supervisor_tempo_minimo_desligado_restante') }}
      pausa_manual: |-
        {{ state_attr('timer.elgin_supervisor_pausa_manual','remaining') }}
      troca_modo: |-
        {{ state_attr('timer.elgin_supervisor_protecao_troca_modo','remaining') }}
      reconciliacao: |-
        {{ state_attr('timer.elgin_supervisor_janela_reconciliacao','remaining') }}
      classificacao: |-
        {{ state_attr('timer.elgin_supervisor_classificacao_fisica','remaining') }}
script:
  elgin_supervisor_aplicar_preset_histerese:
    alias: Elgin Supervisor - Aplicar preset por modo
    description: >-
      Aplica o preset somente ao modo solicitado. Quando o modo é omitido, reaplica
      separadamente os presets atuais de aquecimento,
      refrigeração e Dry. Não altera os helpers automáticos internos e não transmite
      IR diretamente.
    icon: mdi:tune-variant
    mode: queued
    fields:
      modo:
        name: Modo
        description: Modo a atualizar. Omitido reaplica os três modos.
        required: false
        selector:
          select:
            options:
            - Aquecimento
            - Refrigeração
            - Desumidificação
            - Todos
      preset:
        name: Preset
        description: Preset a aplicar. Omitido usa o seletor independente do modo.
        required: false
        selector:
          select:
            options:
            - Economia
            - Equilíbrio
            - Conforto
            - Agressivo
    sequence:
    - variables:
        modo_solicitado: |-
          {{ modo | default('Todos', true) }}
        preset_solicitado: |-
          {{ preset | default('', true) }}
        modos: |-
          {% if modo_solicitado == 'Todos' %}
            {{ ['Aquecimento','Refrigeração','Desumidificação'] }}
          {% else %}
            {{ [modo_solicitado] }}
          {% endif %}
        seletores:
          Aquecimento: input_select.elgin_supervisor_preset_aquecimento
          Refrigeração: input_select.elgin_supervisor_preset_refrigeracao
          Desumidificação: input_select.elgin_supervisor_preset_desumidificacao
        mapa:
          Aquecimento:
            Economia:
              input_number.elgin_supervisor_aquecimento_inicio: 16.5
              input_number.elgin_supervisor_aquecimento_fim: 19.0
            Equilíbrio:
              input_number.elgin_supervisor_aquecimento_inicio: 18.0
              input_number.elgin_supervisor_aquecimento_fim: 20.2
            Conforto:
              input_number.elgin_supervisor_aquecimento_inicio: 19.5
              input_number.elgin_supervisor_aquecimento_fim: 21.3
            Agressivo:
              input_number.elgin_supervisor_aquecimento_inicio: 21.0
              input_number.elgin_supervisor_aquecimento_fim: 22.5
          Refrigeração:
            Economia:
              input_number.elgin_supervisor_refrigeracao_inicio: 26.0
              input_number.elgin_supervisor_refrigeracao_fim: 23.0
            Equilíbrio:
              input_number.elgin_supervisor_refrigeracao_inicio: 25.2
              input_number.elgin_supervisor_refrigeracao_fim: 22.7
            Conforto:
              input_number.elgin_supervisor_refrigeracao_inicio: 24.3
              input_number.elgin_supervisor_refrigeracao_fim: 22.3
            Agressivo:
              input_number.elgin_supervisor_refrigeracao_inicio: 23.5
              input_number.elgin_supervisor_refrigeracao_fim: 22.0
          Desumidificação:
            Economia:
              input_number.elgin_supervisor_desumidificacao_inicio: 65
              input_number.elgin_supervisor_desumidificacao_fim: 60
              input_number.elgin_supervisor_desumidificacao_temperatura_minima: 20.0
            Equilíbrio:
              input_number.elgin_supervisor_desumidificacao_inicio: 63
              input_number.elgin_supervisor_desumidificacao_fim: 57
              input_number.elgin_supervisor_desumidificacao_temperatura_minima: 19.0
            Conforto:
              input_number.elgin_supervisor_desumidificacao_inicio: 61
              input_number.elgin_supervisor_desumidificacao_fim: 54
              input_number.elgin_supervisor_desumidificacao_temperatura_minima: 18.0
            Agressivo:
              input_number.elgin_supervisor_desumidificacao_inicio: 60
              input_number.elgin_supervisor_desumidificacao_fim: 52
              input_number.elgin_supervisor_desumidificacao_temperatura_minima: 17.5
    - if:
      - condition: template
        value_template: |-
          {{ modo_solicitado not in ['Aquecimento','Refrigeração','Desumidificação','Todos'] }}
      then:
      - stop: O modo solicitado não é válido.
        error: true
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.elgin_supervisor_aplicando_preset_histerese
    - repeat:
        for_each: |-
          {{ modos }}
        sequence:
        - variables:
            modo_atual: |-
              {{ repeat.item }}
            seletor_atual: |-
              {{ seletores[repeat.item] }}
            preset_atual: |-
              {% if preset_solicitado in ['Economia','Equilíbrio','Conforto','Agressivo'] %}
                {{ preset_solicitado }}
              {% else %}
                {{ states(seletores[repeat.item]) }}
              {% endif %}
            valores: |-
              {{ mapa[repeat.item].get(preset_atual, {}) }}
        - if:
          - condition: template
            value_template: |-
              {{ valores | count > 0 }}
          then:
          - repeat:
              for_each: |-
                {{ valores | dictsort }}
              sequence:
              - action: input_number.set_value
                target:
                  entity_id: |-
                    {{ repeat.item[0] }}
                data:
                  value: |-
                    {{ repeat.item[1] }}
          - action: input_select.select_option
            target:
              entity_id: |-
                {{ seletor_atual }}
            data:
              option: |-
                {{ preset_atual }}
    - delay: 00:00:01
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.elgin_supervisor_aplicando_preset_histerese
    max: 4
  elgin_supervisor_atualizar_condicoes_regionais:
    alias: Elgin Supervisor - Atualizar condições regionais
    description: Espelha dinamicamente os presets efetivos do novo catálogo nos helpers automáticos legados e atualiza o
      diagnóstico regional.
    icon: mdi:weather-sync
    mode: restart
    sequence:
    - variables:
        modos: |-
          {{ state_attr('sensor.elgin_supervisor_presets_de_condicao','modes') or {} }}
        heat: |-
          {{ (state_attr('sensor.elgin_supervisor_presets_de_condicao','modes') or {}).get('heat') or {} }}
        cool: |-
          {{ (state_attr('sensor.elgin_supervisor_presets_de_condicao','modes') or {}).get('cool') or {} }}
        dry: |-
          {{ (state_attr('sensor.elgin_supervisor_presets_de_condicao','modes') or {}).get('dry') or {} }}
        valores_aplicar: |-
          {{ {
            'input_number.elgin_supervisor_auto_aquecimento_inicio': (heat.get('start',18.0) | float),
            'input_number.elgin_supervisor_auto_aquecimento_fim': (heat.get('stop',20.2) | float),
            'input_number.elgin_supervisor_auto_refrigeracao_inicio': (cool.get('start',25.2) | float),
            'input_number.elgin_supervisor_auto_refrigeracao_fim': (cool.get('stop',22.7) | float),
            'input_number.elgin_supervisor_auto_desumidificacao_inicio': (dry.get('start',63) | int),
            'input_number.elgin_supervisor_auto_desumidificacao_fim': (dry.get('stop',57) | int),
            'input_number.elgin_supervisor_auto_desumidificacao_temperatura_minima': (dry.get('minimum_temperature',19.0) | float)
          } }}
    - repeat:
        for_each: |-
          {{ valores_aplicar | dictsort }}
        sequence:
        - action: input_number.set_value
          target:
            entity_id: |-
              {{ repeat.item[0] }}
          data:
            value: |-
              {{ repeat.item[1] }}
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.elgin_supervisor_ultima_atualizacao_condicoes_regionais
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_atualizacao_condicoes_regionais
      data:
        value: |-
          {% set h = heat.get('effective_name','—') ~ '/N' ~ heat.get('effective_level','—') %}
          {% set c = cool.get('effective_name','—') ~ '/N' ~ cool.get('effective_level','—') %}
          {% set d = dry.get('effective_name','—') ~ '/N' ~ dry.get('effective_level','—') %}
          {{ ('Presets recalculados: heat=' ~ h ~ ', cool=' ~ c ~ ', dry=' ~ d ~ '. ' ~
              'Regional: ' ~ heat.get('regional_reason','—') ~ ' / ' ~ cool.get('regional_reason','—') ~ ' / ' ~ dry.get('regional_reason','—'))
             | truncate(255, true, '') }}
  elgin_supervisor_aplicar_perfis_potencia_rebalanceados:
    alias: Elgin Supervisor - Aplicar perfis de potência rebalanceados
    description: >
      Aplica a matriz padrão da Etapa 2 aos doze alvos de potência. Não
      transmite IR diretamente. Exige supervisor desabilitado e modo sombra.
    icon: mdi:tune-vertical
    mode: single
    sequence:
    - if:
      - condition: state
        entity_id: input_boolean.elgin_supervisor_habilitado
        state: 'on'
      then:
      - stop: >
          Desabilite o supervisor antes de alterar todos os perfis de potência.
        error: true
    - if:
      - condition: state
        entity_id: input_boolean.elgin_supervisor_modo_sombra
        state: 'off'
      then:
      - stop: >
          Ative o modo sombra antes de alterar todos os perfis de potência.
        error: true
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_aquecimento_fraco
      data: {value: 22}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_aquecimento_normal
      data: {value: 24}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_aquecimento_forte
      data: {value: 26}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_aquecimento_extremo
      data: {value: 30}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_refrigeracao_fraco
      data: {value: 25}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_refrigeracao_normal
      data: {value: 23}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_refrigeracao_forte
      data: {value: 22}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_refrigeracao_extremo
      data: {value: 18}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_desumidificacao_fraco
      data: {value: 26}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_desumidificacao_normal
      data: {value: 24}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_desumidificacao_forte
      data: {value: 24}
    - action: input_number.set_value
      target:
        entity_id: input_number.elgin_supervisor_alvo_desumidificacao_extremo
      data: {value: 20}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_decisao
      data:
        value: >
          Perfis rebalanceados aplicados: Fraco/Normal/Forte/Extremo com
          ventilação low/low/medium/high.

  elgin_supervisor_transmitir_estado:
    alias: Elgin Supervisor - Transmitir estado
    description: >
      Envia um frame IR completo, usa a fonte selecionada do iFeel e abre a
      janela de reconciliação com o LocalTuya.
    icon: mdi:remote
    mode: single
    max_exceeded: silent
    sequence:
    - variables:
        fonte_ifeel: |-
          {{ states('sensor.elgin_supervisor_fonte_ifeel_efetiva') }}
        temperatura_atual: |-
          {% set fonte =
               states('sensor.elgin_supervisor_fonte_ifeel_efetiva') %}
          {% set efetiva =
               states('sensor.elgin_supervisor_temperatura_ifeel_efetiva') %}
          {% if fonte == 'Semi-automático'
                and is_number(target_temperature) %}
            {{ target_temperature | float | round(0) | int }}
          {% elif is_number(efetiva) %}
            {{ efetiva | float | round(0) | int }}
          {% else %}
            20
          {% endif %}
        temperatura_ifeel_valida: |-
          {% set fonte =
               states('sensor.elgin_supervisor_fonte_ifeel_efetiva') %}
          {% set efetiva =
               states('sensor.elgin_supervisor_temperatura_ifeel_efetiva') %}
          {{ not is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on')
             or (
               fonte == 'Semi-automático'
               and is_number(target_temperature)
             )
             or is_number(efetiva) }}
        swing: |-
          {% if tratamento == 'Aquecimento' %}vertical
          {% elif tratamento == 'Refrigeração' %}both
          {% elif tratamento == 'Desumidificação' %}off
          {% elif power | bool %}
            {{ state_attr('sensor.elgin_supervisor_configuracao_desejada','swing')
               | default('off', true) }}
          {% else %}
            {{ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado')
               | default('off', true) }}
          {% endif %}
        fan_final: |
          {% if is_state('binary_sensor.elgin_supervisor_turbo_efetivo','on') and power | bool %}high
          {% elif fan == 'quiet' %}low
          {% else %}{{ fan }}{% endif %}
    - variables:
        turbo_final: |-
          {{ power | bool and fan_final == 'high' and is_state('binary_sensor.elgin_supervisor_turbo_efetivo','on') }}
        sleep_final: |-
          {{ power | bool and is_state('binary_sensor.elgin_supervisor_sleep_efetivo','on') }}
        health_final: |-
          {{ power | bool and is_state('binary_sensor.elgin_supervisor_health_efetivo','on') }}
        assinatura_ir: |-
          {{ ('p=' ~ (1 if power | bool else 0)
              ~ '|m=' ~ (mode | string | trim)
              ~ '|f=' ~ (fan_final | string | trim)
              ~ '|t=' ~ (target_temperature | int)
              ~ '|s=' ~ (swing | string | trim)
              ~ '|i=' ~ (1 if is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on') else 0)
              ~ '|tb=' ~ (1 if turbo_final | bool else 0)
              ~ '|sl=' ~ (1 if sleep_final | bool else 0)
              ~ '|h=' ~ (1 if health_final | bool else 0)) | truncate(255, true, '') }}
        assinatura_anterior: |-
          {{ states('input_text.elgin_supervisor_assinatura_ultimo_ir') }}
        forcar_envio_final: |-
          {{ forcar_envio | default(false, true) | bool }}
    - if:
      - condition: template
        value_template: |-
          {{ not (temperatura_ifeel_valida | bool) }}
      then:
      - stop: >
          A fonte selecionada do iFeel está indisponível; transmissão cancelada.
        error: true
    - if:
      - condition: template
        value_template: |-
          {{ not (forcar_envio_final | bool)
             and assinatura_anterior not in ['', 'unknown', 'unavailable', 'none']
             and assinatura_anterior == assinatura_ir }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            {{ ('IR idêntico suprimido: ' ~ assinatura_ir ~ '. Motivo solicitado: ' ~ motivo)
               | truncate(255, true, '') }}
      - stop: A mesma configuração completa já foi transmitida; reenvio bloqueado.
    - if:
      - condition: template
        value_template: |-
          {{ power | bool and tratamento in ['Aquecimento','Refrigeração','Desumidificação'] and is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','off') }}
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.elgin_supervisor_temperatura_na_ativacao
        data:
          value: |-
            {{ states('sensor.sensor_temperatura_sensor_dedicado') | float(20) | round(1) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.elgin_supervisor_umidade_na_ativacao
        data:
          value: |-
            {{ states('sensor.sensor_umidade_sensor_dedicado') | float(50) | round(0) | int }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.elgin_supervisor_inicio_do_ciclo
        data:
          datetime: |-
            {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
    - action: timer.start
      target:
        entity_id: timer.elgin_supervisor_janela_reconciliacao
      data:
        duration: 00:00:30
    - action: esphome.esp8266_elgin_send_state
      data:
        power: |-
          {{ power | bool }}
        mode: |-
          {{ mode }}
        fan: |-
          {{ fan_final }}
        target_temperature: |-
          {{ target_temperature | int }}
        current_temperature: |-
          {{ temperatura_atual }}
        ifeel: |-
          {{ is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on') }}
        swing_vertical: |-
          {{ swing in ['vertical','both'] }}
        swing_horizontal: |-
          {{ swing in ['horizontal','both'] }}
        turbo: |-
          {{ turbo_final | bool }}
        sleep_enabled: |-
          {{ sleep_final | bool }}
        health: |-
          {{ health_final | bool }}
        command: |-
          {{ 'temperature_up' if power | bool else 'power' }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_assinatura_ultimo_ir
      data:
        value: |-
          {{ assinatura_ir }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultimo_envio_ir
      data:
        value: |-
          {{ (now().strftime('%Y-%m-%d %H:%M:%S') ~ ' · ' ~ assinatura_ir ~ ' · ' ~ motivo)
             | truncate(255, true, '') }}
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.elgin_supervisor_ultimo_comando
        - input_datetime.elgin_aux_ultima_atualizacao_temperatura
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_decisao
      data:
        value: |-
          {% if power | bool and tratamento in ['Aquecimento','Refrigeração','Desumidificação'] %}
            {% set d = 'sensor.elgin_supervisor_diagnostico_de_potencia' %}
            {% set final = states(d) %}
            {% set base = state_attr(d,'potencia_base') %}
            {% set nivel_base = state_attr(d,'nivel_base') | int(-1) %}
            {% set clima = state_attr(d,'ajuste_clima') | int(0) %}
            {% set preset_ajuste = state_attr(d,'ajuste_preset') | int(0) %}
            {% set preset = state_attr(d,'preset') %}
            {% set delta = state_attr(d,'delta_local') %}
            {% set unidade = state_attr(d,'unidade_delta') %}
            {% set temperatura = states('sensor.sensor_temperatura_sensor_dedicado') | float | round(1) %}
            {% set umidade = states('sensor.sensor_umidade_sensor_dedicado') | float | round(0) | int %}
            {% set temperatura_inicio = states('input_number.elgin_supervisor_temperatura_na_ativacao') | float | round(1) %}
            {% set umidade_inicio = states('input_number.elgin_supervisor_umidade_na_ativacao') | float | round(0) | int %}
            {% set clima_txt = ('+' ~ clima) if clima > 0 else clima %}
            {% set preset_txt = ('+' ~ preset_ajuste) if preset_ajuste > 0 else preset_ajuste %}
            {% set ifeel_txt = temperatura_atual ~ '°C ' ~ fonte_ifeel
                 if is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on') else 'off' %}
            {% set msg = tratamento ~ ': ' ~ target_temperature ~ '°C/' ~ fan_final
                ~ ', swing=' ~ swing ~ '; potência=' ~ final
                ~ ' [base=' ~ base ~ '(' ~ nivel_base ~ '), Δlocal=' ~ delta ~ unidade
                ~ ', clima=' ~ clima_txt ~ ', preset=' ~ preset_txt ~ ' ' ~ preset ~ ']'
                ~ '; atual T=' ~ temperatura ~ '°C/H=' ~ umidade ~ '%'
                ~ '; ativação T=' ~ temperatura_inicio ~ '°C/H=' ~ umidade_inicio ~ '%'
                ~ '; iFeel=' ~ ifeel_txt ~ '.' %}
            {{ msg | string | truncate(255, true, '') }}
          {% else %}
            {% set detalhe = 'iFeel=' ~ temperatura_atual ~ '°C (' ~ fonte_ifeel ~ ')'
                 if is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on') else 'iFeel=off' %}
            {{ (motivo ~ ' ' ~ detalhe ~ '.') | string | truncate(255, true, '') }}
          {% endif %}
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.elgin_aux_alteracoes_avancadas_pendentes
    - action: input_select.select_option
      target:
        entity_id: input_select.elgin_supervisor_tratamento_ativo
      data:
        option: |-
          {{ tratamento }}
  elgin_supervisor_reconciliar_eco:
    alias: Elgin Supervisor - Reconciliar Eco LocalTuya
    description: >
      Garante o Eco somente em refrigeração. Comandos repetidos são bloqueados
      por cinco segundos para impedir bipes duplicados.
    icon: mdi:leaf
    mode: single
    max_exceeded: silent
    fields:
      motivo:
        name: Motivo
        required: false
        selector:
          text:
    sequence:
    - variables:
        modo_localtuya: |-
          {% set x = states('select.smart_air_conditioner_mode_ar_condicionado_id_4') %}
          {{ {'Frio':'cool','Quente':'heat','Desumidificar':'dry','Ventilar':'fan','Automático':'auto'}.get(x,'unknown') }}
        eco_agenda: |-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','eco') | default('default', true) }}
        eco_desejado: |-
          {% if eco_agenda == 'on' %}on
          {% elif eco_agenda == 'off' %}off
          {% elif is_state('input_boolean.elgin_supervisor_usar_eco','on') %}on
          {% else %}ignore{% endif %}
        assinatura_ultimo_ir: |-
          {{ states('input_text.elgin_supervisor_assinatura_ultimo_ir') }}
        segundos_desde_ultimo_ir: |-
          {{ as_timestamp(now()) - as_timestamp(states('input_datetime.elgin_supervisor_ultimo_comando'), 0) }}
    - if:
      - condition: template
        value_template: |-
          {{ eco_desejado == 'ignore' }}
      then:
      - stop: Eco segue controle externo; o Supervisor não interfere.
    - if:
      - condition: state
        entity_id: switch.smart_air_conditioner_power_ar_condicionado_id_1
        state: 'off'
      then:
      - stop: Aparelho desligado; Eco não será comandado.
    - if:
      - condition: template
        value_template: |-
          {{ modo_localtuya != 'cool' }}
      then:
      - stop: >
          Eco protegido: o modo físico confirmado não é refrigeração.
          Nenhum comando LocalTuya foi emitido.
    - if:
      - condition: template
        value_template: |-
          {{ segundos_desde_ultimo_ir | float(9999) < 60
             and assinatura_ultimo_ir not in ['', 'unknown', 'unavailable', 'none']
             and '|m=cool|' not in assinatura_ultimo_ir }}
      then:
      - stop: >
          Eco protegido: o último IR completo recente solicitou outro modo,
          embora o LocalTuya ainda apresente Frio de forma transitória.
    - if:
      - condition: template
        value_template: |-
          {{ not is_state('timer.elgin_supervisor_bloqueio_comando_eco','idle') }}
      then:
      - stop: Comando Eco recente; tentativa duplicada suprimida.
    - if:
      - condition: template
        value_template: |-
          {{ states('switch.smart_air_conditioner_eco_ar_condicionado_id_8') in ['unknown','unavailable'] }}
      then:
      - stop: Entidade Eco LocalTuya indisponível.
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ eco_desejado == 'on' and not is_state('switch.smart_air_conditioner_eco_ar_condicionado_id_8','on') }}
        sequence:
        - action: timer.start
          target:
            entity_id: timer.elgin_supervisor_bloqueio_comando_eco
          data:
            duration: 00:00:05
        - action: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.smart_air_conditioner_eco_ar_condicionado_id_8
      - conditions:
        - condition: template
          value_template: |-
            {{ eco_desejado == 'off' and is_state('switch.smart_air_conditioner_eco_ar_condicionado_id_8','on') }}
        sequence:
        - action: timer.start
          target:
            entity_id: timer.elgin_supervisor_bloqueio_comando_eco
          data:
            duration: 00:00:05
        - action: switch.turn_off
          continue_on_error: true
          target:
            entity_id: switch.smart_air_conditioner_eco_ar_condicionado_id_8

  elgin_supervisor_aplicar_decisao:
    alias: Elgin Supervisor - Aplicar decisão
    description: Compara a decisão com o estado físico LocalTuya e só transmite quando necessário.
    icon: mdi:state-machine
    mode: restart
    sequence:
    - variables:
        desejado: |-
          {{ states('sensor.elgin_supervisor_tratamento_desejado') }}
        mode_desejado: |-
          {{ state_attr('sensor.elgin_supervisor_configuracao_desejada','mode') | default('cool',true) }}
        fan_desejado: |-
          {{ state_attr('sensor.elgin_supervisor_configuracao_desejada','fan') | default('auto',true) }}
        alvo_desejado: |-
          {{ state_attr('sensor.elgin_supervisor_configuracao_desejada','target_temperature') | int(24) }}
        power_atual: |-
          {{ is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on') }}
        mode_atual: |-
          {% set x = states('select.smart_air_conditioner_mode_ar_condicionado_id_4') %}
          {{ {'Frio':'cool','Quente':'heat','Desumidificar':'dry','Ventilar':'fan','Automático':'auto'}.get(x,'unknown') }}
        fan_atual: |-
          {% set x = states('select.smart_air_conditioner_windspeed_ar_condicionado_id_5') %}
          {{ {'Baixa':'low','Média':'medium','Alta':'high','Automática':'auto','Silencioso':'quiet'}.get(x,'unknown') }}
        alvo_atual: |-
          {{ (states('number.smart_air_conditioner_temperatura_alvo_ar_condicionado_id_2') | float(240) / 10) | round(0) | int }}
        swing_desejado: |-
          {{ state_attr(
               'sensor.elgin_supervisor_configuracao_desejada', 'swing'
             ) | default('off', true) }}
        swing_vertical_desejado: |-
          {{ swing_desejado in ['vertical', 'both'] }}
        swing_horizontal_desejado: |-
          {{ swing_desejado in ['horizontal', 'both'] }}
        swing_vertical_atual: |-
          {{ is_state(
               'switch.smart_air_conditioner_up_down_wind_ar_condicionado_id_105',
               'on'
             ) }}
        swing_horizontal_atual: |-
          {{ is_state(
               'switch.smart_air_conditioner_swing_ar_condicionado_id_33',
               'on'
             ) }}
        segundos_power: |-
          {{ as_timestamp(now()) - as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) }}
        agenda_acao: |-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','global_action') | default('normal', true) }}
        snapshot_policy: |-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','snapshot_revision') | int(-1) }}
        snapshot_preset: |-
          {{ state_attr('sensor.elgin_supervisor_presets_de_condicao','snapshot_revision') | int(-2) }}
        snapshot_power: |-
          {{ state_attr('sensor.elgin_supervisor_potencias','snapshot_revision') | int(-3) }}
        pipeline_integrity_ok: |-
          {% set integrity = state_attr('sensor.elgin_supervisor_potencias','integrity') or {} %}
          {{ integrity.get('ok', false) | bool(false) }}
        snapshot_consistente: |-
          {{ snapshot_policy | int(-1) >= 0
             and snapshot_policy | int(-1) == snapshot_preset | int(-2)
             and snapshot_policy | int(-1) == snapshot_power | int(-3)
             and pipeline_integrity_ok | bool(false) }}
        agenda_power_off_token: |
          {% set fontes = state_attr('sensor.elgin_supervisor_agenda_politica','effect_sources') or {} %}
          {% set origem = fontes.get('global_action') or {} %}
          {% set regra_vencedora = origem.get('rule_id','') | string %}
          {% set ocorrencias = state_attr('sensor.elgin_supervisor_agenda_politica','active_occurrences') or [] %}
          {% set ns = namespace(token='') %}
          {% for item in ocorrencias %}
            {% if (item.get('rule_id','') | string) == regra_vencedora %}
              {% set ns.token = 'power_off|' ~ regra_vencedora ~ '@' ~ (item.get('start','') | string) %}
            {% endif %}
          {% endfor %}
          {{ (ns.token if ns.token else 'power_off|' ~ regra_vencedora) | truncate(255, true, '') }}
        agenda_power_off_token_aplicado: |
          {{ states('input_text.elgin_supervisor_agenda_power_off_token') }}
        agenda_bloquear_partida: |-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','block_start') | default(false, true) }}
        agenda_bloquear_desligamento: |-
          {{ state_attr('sensor.elgin_supervisor_agenda_politica','block_automatic_off') | default(false, true) }}
        minimo_ligado: |-
          {% set ag = state_attr('sensor.elgin_supervisor_agenda_politica','minimum_on_minutes') %}
          {{ (ag | float if ag is not none else states('input_number.elgin_supervisor_tempo_minimo_ligado') | float(10)) * 60 }}
        minimo_desligado: |-
          {% set ag = state_attr('sensor.elgin_supervisor_agenda_politica','minimum_off_minutes') %}
          {{ (ag | float if ag is not none else states('input_number.elgin_supervisor_tempo_minimo_desligado') | float(5)) * 60 }}
        preservar_fisico: |-
          {{ is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') }}
        fisico_semiautomatico: |
          {{ is_state('binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo','on') }}
        tratamento_fisico: |-
          {{ states('input_select.elgin_supervisor_tratamento_fisico_classificado') }}
        ifeel_desejado: |
          {{ is_state('binary_sensor.elgin_supervisor_ifeel_efetivo','on') }}
        turbo_desejado: |
          {{ is_state('binary_sensor.elgin_supervisor_turbo_efetivo','on') }}
        sleep_desejado: |
          {{ is_state('binary_sensor.elgin_supervisor_sleep_efetivo','on') }}
        health_desejado: |
          {{ is_state('binary_sensor.elgin_supervisor_health_efetivo','on') }}
        assinatura_desejada: |
          {{ ('p=' ~ (1 if desejado in ['Aquecimento','Refrigeração','Desumidificação'] else 0)
              ~ '|m=' ~ mode_desejado
              ~ '|f=' ~ fan_desejado
              ~ '|t=' ~ alvo_desejado
              ~ '|s=' ~ swing_desejado
              ~ '|i=' ~ (1 if ifeel_desejado | bool else 0)
              ~ '|tb=' ~ (1 if turbo_desejado | bool else 0)
              ~ '|sl=' ~ (1 if sleep_desejado | bool else 0)
              ~ '|h=' ~ (1 if health_desejado | bool else 0)) | truncate(255, true, '') }}
        assinatura_anterior: |
          {{ states('input_text.elgin_supervisor_assinatura_ultimo_ir') }}
        diferenca: |
          {{ not power_atual
             or mode_atual != mode_desejado
             or fan_atual != fan_desejado
             or alvo_atual != alvo_desejado
             or (swing_vertical_atual | bool) != (swing_vertical_desejado | bool)
             or (swing_horizontal_atual | bool) != (swing_horizontal_desejado | bool)
             or assinatura_anterior != assinatura_desejada
             or is_state('input_boolean.elgin_aux_alteracoes_avancadas_pendentes','on')
             or (not is_state('binary_sensor.esp8266_elgin_aux_estado_base_valido','on') and not (preservar_fisico | bool)) }}
    - if:
      - condition: state
        entity_id: input_boolean.elgin_supervisor_habilitado
        state: 'off'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Supervisor desabilitado; nenhuma ação executada.
      - stop: Supervisor desabilitado.
    - if:
      - condition: template
        value_template: "{{ not (snapshot_consistente | bool(false)) }}"
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Snapshot inconsistente; comando bloqueado. Política={{ snapshot_policy }}, preset={{ snapshot_preset }}, potência={{ snapshot_power }}, integridade={{ pipeline_integrity_ok }}.
      - stop: Aguardando snapshot atômico da Agenda, presets e potência.
    - if:
      - condition: template
        value_template: |-
          {{ agenda_acao in ['disable_supervisor','suspend'] }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Agenda ativa: {{ agenda_acao }}; decisões suspensas sem alterar os helpers manuais.
      - stop: Operação suspensa pela agenda.
    - if:
      - condition: template
        value_template: "{{ agenda_acao == 'power_off_block' }}"
      then:
      - if:
        - condition: template
          value_template: "{{ power_atual }}"
        then:
        - action: script.elgin_supervisor_transmitir_estado
          data:
            tratamento: Nenhum
            power: false
            mode: "{{ mode_atual if mode_atual != 'unknown' else 'cool' }}"
            fan: "{{ fan_atual if fan_atual in ['low','medium','high','auto'] else 'auto' }}"
            target_temperature: "{{ alvo_atual }}"
            motivo: "Desligamento e bloqueio de religamento solicitados pela Agenda."
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: "Agenda ativa: ar desligado e qualquer religamento será bloqueado."
      - stop: "Desligamento com bloqueio imposto pela Agenda."
    - if:
      - condition: template
        value_template: "{{ agenda_acao == 'power_off' }}"
      then:
      - if:
        - condition: template
          value_template: "{{ agenda_power_off_token_aplicado != agenda_power_off_token }}"
        then:
        - if:
          - condition: template
            value_template: "{{ power_atual }}"
          then:
          - action: script.elgin_supervisor_transmitir_estado
            data:
              tratamento: Nenhum
              power: false
              mode: "{{ mode_atual if mode_atual != 'unknown' else 'cool' }}"
              fan: "{{ fan_atual if fan_atual in ['low','medium','high','auto'] else 'auto' }}"
              target_temperature: "{{ alvo_atual }}"
              motivo: "Desligamento único solicitado pela Agenda; religamento manual posterior será permitido."
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_agenda_power_off_token
          data:
            value: "{{ agenda_power_off_token }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: "Agenda: desligamento único aplicado para esta ocorrência; religamento manual posterior permitido."
      - stop: "Desligamento único da Agenda já processado."
    - if:
      - condition: template
        value_template: |-
          {{ is_state('input_boolean.elgin_aux_sincronizacao_passiva_em_andamento','on')
             or is_state('timer.elgin_supervisor_classificacao_fisica','active') }}
      then:
      - stop: Aguardando concluir a sincronização/classificação física. O timer libera automaticamente em caso de falha.
    - if:
      - condition: template
        value_template: |-
          {{ is_state('input_boolean.elgin_supervisor_modo_sombra','on') or agenda_acao == 'shadow' }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            {% if preservar_fisico | bool %}
              {% set msg = 'Sombra físico adotado: ' ~ tratamento_fisico
                  ~ '/' ~ states('input_select.elgin_supervisor_potencia_fisica_classificada')
                  ~ ', recebido ' ~ alvo_atual ~ '°C/' ~ fan_atual
                  ~ ', swing=' ~ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado')
                  ~ '; nenhum IR.' %}
              {{ msg | string | truncate(255,true,'') }}
            {% elif desejado == 'Nenhum' %}
              Modo sombra: nenhuma demanda ativa; nenhum IR enviado.
            {% else %}
              {% set d = 'sensor.elgin_supervisor_diagnostico_de_potencia' %}
              {% set clima = state_attr(d,'ajuste_clima') | int(0) %}
              {% set preset_ajuste = state_attr(d,'ajuste_preset') | int(0) %}
              {% set clima_txt = ('+' ~ clima) if clima > 0 else clima %}
              {% set preset_txt = ('+' ~ preset_ajuste) if preset_ajuste > 0 else preset_ajuste %}
              {% set msg = 'Sombra: ' ~ desejado ~ ' ' ~ alvo_desejado ~ '°C/' ~ fan_desejado
                  ~ '; potência=' ~ states(d)
                  ~ ' [base=' ~ state_attr(d,'potencia_base')
                  ~ ', clima=' ~ clima_txt
                  ~ ', preset=' ~ preset_txt ~ ' ' ~ state_attr(d,'preset') ~ ']'
                  ~ '; T=' ~ (states('sensor.sensor_temperatura_sensor_dedicado') | float | round(1))
                  ~ '°C/H=' ~ (states('sensor.sensor_umidade_sensor_dedicado') | float | round(0) | int)
                  ~ '%; nenhum IR.' %}
              {{ msg | string | truncate(255,true,'') }}
            {% endif %}
      - stop: Modo sombra ativo.
    - if:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_falha_reportada
        state: 'on'
      then:
      - if:
        - condition: template
          value_template: |-
            {{ power_atual }}
        then:
        - action: script.elgin_supervisor_transmitir_estado
          data:
            tratamento: Falha
            power: false
            mode: |-
              {{ mode_atual if mode_atual != 'unknown' else 'cool' }}
            fan: |-
              {{ fan_atual if fan_atual in ['low','medium','high','auto'] else 'auto' }}
            target_temperature: |-
              {{ alvo_atual }}
            motivo: Falha LocalTuya reportada; desligamento de segurança.
      - action: input_select.select_option
        target:
          entity_id: input_select.elgin_supervisor_tratamento_ativo
        data:
          option: Falha
      - stop: Falha reportada pelo aparelho.
    - if:
      - condition: state
        entity_id: binary_sensor.elgin_supervisor_fontes_locais_validas
        state: 'off'
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Fontes locais inválidas; nenhuma transmissão.
      - stop: Fontes locais inválidas.
    - if:
      - condition: template
        value_template: |-
          {{ fisico_semiautomatico | bool and is_state('input_boolean.elgin_supervisor_estado_fisico_adotado','on') and tratamento_fisico == 'Não supervisionado' and power_atual }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: Modo físico sem perfil supervisionado; estado externo preservado sem pausa e sem correção IR.
      - stop: Modo físico não supervisionado preservado.
    - if:
      - condition: template
        value_template: |-
          {{ fisico_semiautomatico | bool and not is_state('timer.elgin_supervisor_pausa_manual','idle') }}
      then:
      - action: timer.cancel
        target:
          entity_id: timer.elgin_supervisor_pausa_manual
    - if:
      - condition: template
        value_template: |-
          {{ is_state('input_boolean.elgin_supervisor_estado_fisico_adotado','on') and not (preservar_fisico | bool) }}
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elgin_supervisor_estado_fisico_adotado
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
        data:
          value: Supervisor reassumiu o perfil porque o tratamento ou a potência calculada mudou.
    - if:
      - condition: template
        value_template: |-
          {{ not is_state('timer.elgin_supervisor_pausa_manual','idle') and not (fisico_semiautomatico | bool) }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Controle manual respeitado até o término da pausa.
      - stop: Pausa manual ativa.
    - if:
      - condition: template
        value_template: |-
          {{ not is_state('timer.elgin_supervisor_protecao_troca_modo','idle') }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Aguardando proteção para troca de modo.
      - stop: Proteção de troca de modo ativa.
    - if:
      - condition: template
        value_template: |-
          {{ is_state('script.elgin_supervisor_transmitir_estado','on')
             or not is_state('timer.elgin_supervisor_janela_reconciliacao','idle') }}
      then:
      - stop: Aguardando concluir a única transmissão em curso e sua reconciliação física.
    - if:
      - condition: template
        value_template: |-
          {{ preservar_fisico | bool and power_atual }}
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.elgin_supervisor_tratamento_ativo
        data:
          option: |-
            {{ tratamento_fisico }}
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            {% set msg = 'Estado físico adotado e preservado sem IR: ' ~ tratamento_fisico
                ~ '/' ~ states('input_select.elgin_supervisor_potencia_fisica_classificada')
                ~ ', recebido ' ~ alvo_atual ~ '°C/' ~ fan_atual
                ~ ', swing=' ~ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado')
                ~ '. O Supervisor reassumirá somente quando tratamento ou potência calculada mudar.' %}
            {{ msg | string | truncate(255,true,'') }}
      - stop: Estado físico preservado; comparação com o perfil automático não deve gerar IR corretivo.
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ desejado == 'Nenhum' }}
        sequence:
        - if:
          - condition: template
            value_template: |-
              {{ agenda_bloquear_desligamento | bool }}
          then:
          - stop: Agenda bloqueia o desligamento automático neste período.
        - if:
          - condition: template
            value_template: |-
              {{ power_atual and segundos_power < minimo_ligado }}
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.elgin_supervisor_ultima_decisao
            data:
              value: |-
                Desligamento adiado pelo tempo mínimo ligado.
          - stop: Tempo mínimo ligado ainda não terminou.
        - if:
          - condition: template
            value_template: |-
              {{ power_atual }}
          then:
          - action: script.elgin_supervisor_transmitir_estado
            data:
              tratamento: Nenhum
              power: false
              mode: |-
                {{ mode_atual if mode_atual != 'unknown' else 'cool' }}
              fan: |-
                {{ fan_atual if fan_atual in ['low','medium','high','auto'] else 'auto' }}
              target_temperature: |-
                {{ alvo_atual }}
              motivo: Nenhuma demanda ativa; aparelho desligado pelo supervisor.
          else:
          - action: input_select.select_option
            target:
              entity_id: input_select.elgin_supervisor_tratamento_ativo
            data:
              option: Nenhum
          - action: input_text.set_value
            target:
              entity_id: input_text.elgin_supervisor_ultima_decisao
            data:
              value: Nenhuma demanda ativa e aparelho já desligado.
      - conditions:
        - condition: template
          value_template: |-
            {{ desejado in ['Aquecimento','Refrigeração','Desumidificação'] }}
        sequence:
        - if:
          - condition: template
            value_template: |-
              {{ agenda_bloquear_partida | bool and not power_atual }}
          then:
          - stop: Agenda bloqueia novas partidas neste período.
        - if:
          - condition: template
            value_template: |-
              {{ not power_atual and segundos_power < minimo_desligado }}
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.elgin_supervisor_ultima_decisao
            data:
              value: Partida adiada pelo tempo mínimo desligado.
          - stop: Tempo mínimo desligado ainda não terminou.
        - if:
          - condition: template
            value_template: |-
              {{ power_atual and mode_atual != 'unknown' and mode_atual != mode_desejado }}
          then:
          - action: script.elgin_supervisor_transmitir_estado
            data:
              tratamento: Transição
              power: false
              mode: |-
                {{ mode_atual }}
              fan: |-
                {{ fan_atual if fan_atual in ['low','medium','high','auto'] else 'auto' }}
              target_temperature: |-
                {{ alvo_atual }}
              motivo: |-
                Troca de {{ mode_atual }} para {{ mode_desejado }}; desligamento antes da proteção.
          - action: timer.start
            target:
              entity_id: timer.elgin_supervisor_protecao_troca_modo
            data:
              duration: |-
                {% set m = state_attr('sensor.elgin_supervisor_tempos_efetivos','protecao_troca_modo') | int(3) %}
                {{ '%02d:%02d:00' | format(m // 60, m % 60) }}
          - action: input_select.select_option
            target:
              entity_id: input_select.elgin_supervisor_tratamento_ativo
            data:
              option: Transição
          - stop: Transição de modo iniciada.
        - if:
          - condition: template
            value_template: |-
              {{ diferenca | bool }}
          then:
          - action: script.elgin_supervisor_transmitir_estado
            data:
              tratamento: |-
                {{ desejado }}
              power: true
              mode: |-
                {{ mode_desejado }}
              fan: |-
                {{ fan_desejado }}
              target_temperature: |-
                {{ alvo_desejado }}
              motivo: |-
                Aplicado {{ desejado }}: mode={{ mode_desejado }},
                alvo={{ alvo_desejado }}°C, fan={{ fan_desejado }},
                swing={{ swing_desejado }}.
          else:
          - action: input_select.select_option
            target:
              entity_id: input_select.elgin_supervisor_tratamento_ativo
            data:
              option: |-
                {{ desejado }}
          - action: input_text.set_value
            target:
              entity_id: input_text.elgin_supervisor_ultima_decisao
            data:
              value: |-
                {% if preservar_fisico | bool %}
                  {% set msg = 'Estado físico adotado e preservado: ' ~ desejado
                      ~ '/' ~ states('input_select.elgin_supervisor_potencia_fisica_classificada')
                      ~ ', recebido ' ~ alvo_atual ~ '°C/' ~ fan_atual
                      ~ ', swing=' ~ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado')
                      ~ '; nenhum IR. Supervisor reassumirá quando a potência calculada mudar.' %}
                  {{ msg | string | truncate(255,true,'') }}
                {% else %}
                  {% set d = 'sensor.elgin_supervisor_diagnostico_de_potencia' %}
                  {% set clima = state_attr(d,'ajuste_clima') | int(0) %}
                  {% set preset_ajuste = state_attr(d,'ajuste_preset') | int(0) %}
                  {% set clima_txt = ('+' ~ clima) if clima > 0 else clima %}
                  {% set preset_txt = ('+' ~ preset_ajuste) if preset_ajuste > 0 else preset_ajuste %}
                  {% set msg = 'Estado já corresponde a ' ~ desejado
                      ~ ': ' ~ alvo_desejado ~ '°C/' ~ fan_desejado
                      ~ ', swing=' ~ swing_desejado
                      ~ '; potência=' ~ states(d)
                      ~ ' [base=' ~ state_attr(d,'potencia_base')
                      ~ ', clima=' ~ clima_txt
                      ~ ', preset=' ~ preset_txt ~ ' ' ~ state_attr(d,'preset') ~ ']'
                      ~ '; nenhum IR.' %}
                  {{ msg | string | truncate(255,true,'') }}
                {% endif %}
  elgin_supervisor_avaliar_agora:
    alias: Elgin Supervisor - Avaliar agora
    icon: mdi:play-circle
    mode: restart
    sequence:
    - action: script.elgin_supervisor_aplicar_decisao
  elgin_supervisor_liberar_pausa_manual:
    alias: Elgin Supervisor - Liberar pausa manual
    icon: mdi:remote
    mode: restart
    sequence:
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_pausa_manual
    - action: script.elgin_supervisor_aplicar_decisao
  elgin_supervisor_encerrar_ciclo_por_power_off_observado:
    alias: Elgin Supervisor - Encerrar ciclo por Power OFF observado
    description: Encerra imediatamente o ciclo interno quando o LocalTuya confirma Power OFF. O desligamento observado 
      tem prioridade inclusive durante a janela de reconciliação.
    icon: mdi:power-plug-off
    mode: restart
    fields:
      origem:
        name: Origem
        description: Entidade ou fluxo que confirmou o Power OFF.
        required: false
        selector:
          text:
    sequence:
    - variables:
        origem_final: |-
          {{ origem | default('switch.smart_air_conditioner_power_ar_condicionado_id_1', true) }}
        tratamento_anterior: |-
          {{ states('input_select.elgin_supervisor_tratamento_ativo') }}
        reconciliacao_estava_ativa: |-
          {{ is_state('timer.elgin_supervisor_janela_reconciliacao','active') }}
        classificacao_estava_ativa: |-
          {{ is_state('timer.elgin_supervisor_classificacao_fisica','active') or is_state('script.elgin_supervisor_adotar_estado_fisico','on') }}
        temperatura_atual: |-
          {{ states('sensor.sensor_temperatura_sensor_dedicado') | float(0) | round(1) }}
        umidade_atual: |-
          {{ states('sensor.sensor_umidade_sensor_dedicado') | float(0) | round(0) | int }}
    - action: script.turn_off
      continue_on_error: true
      target:
        entity_id: script.elgin_supervisor_adotar_estado_fisico
    - action: timer.cancel
      target:
        entity_id:
        - timer.elgin_supervisor_classificacao_fisica
        - timer.elgin_supervisor_janela_reconciliacao
        - timer.elgin_supervisor_pausa_manual
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.elgin_supervisor_processando_comando_fisico
        - input_boolean.elgin_supervisor_estado_fisico_adotado
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_assinatura_ultimo_ir
      data:
        value: ''
    - action: input_select.select_option
      target:
        entity_id: input_select.elgin_supervisor_tratamento_ativo
      data:
        option: Nenhum
    - action: input_select.select_option
      target:
        entity_id: input_select.elgin_supervisor_tratamento_fisico_classificado
      data:
        option: Nenhum
    - action: input_select.select_option
      target:
        entity_id:
        - input_select.elgin_supervisor_potencia_fisica_classificada
        - input_select.elgin_supervisor_potencia_supervisor_na_adocao
      data:
        option: Nenhuma
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.elgin_supervisor_ultima_mudanca_power
        - input_datetime.elgin_supervisor_ultima_classificacao_fisica
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
      data:
        value: |-
          {% set msg = 'Power OFF observado por ' ~ origem_final
              ~ '; ciclo anterior=' ~ tratamento_anterior
              ~ '; reconciliação anterior=' ~ reconciliacao_estava_ativa
              ~ '; classificação anterior=' ~ classificacao_estava_ativa
              ~ '. Estado físico e adoção foram limpos com prioridade.' %}
          {{ msg | string | truncate(255, true, '') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.elgin_supervisor_ultima_decisao
      data:
        value: |-
          {% set msg = 'Desligamento observado com prioridade: ciclo '
              ~ tratamento_anterior ~ ' encerrado por ' ~ origem_final
              ~ '; T=' ~ temperatura_atual ~ '°C/H=' ~ umidade_atual ~ '%'
              ~ '; reconciliação cancelada. Nova partida somente pela condição de início'
              ~ ' e após o tempo mínimo desligado.' %}
          {{ msg | string | truncate(255, true, '') }}
    - delay: 00:00:01
    - if:
      - condition: state
        entity_id: input_boolean.elgin_supervisor_habilitado
        state: 'on'
      - condition: state
        entity_id: input_boolean.elgin_aux_sincronizacao_passiva_em_andamento
        state: 'off'
      then:
      - action: script.elgin_supervisor_aplicar_decisao
  elgin_supervisor_adotar_estado_fisico:
    alias: Elgin Supervisor - Adotar estado físico
    description: Classifica e adota um comando externo sem corrigir imediatamente os parâmetros recebidos.
    icon: mdi:remote-sync
    mode: restart
    sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
    - action: timer.start
      target:
        entity_id: timer.elgin_supervisor_classificacao_fisica
      data:
        duration: 00:00:15
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_pausa_manual
    - variables:
        power: |-
          {{ is_state('switch.smart_air_conditioner_power_ar_condicionado_id_1','on') }}
        tratamento: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','tratamento') }}
        potencia_fisica: |-
          {{ states('sensor.elgin_supervisor_classificacao_do_estado_fisico') }}
        mode: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','mode') }}
        fan: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','fan') }}
        alvo: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','target_temperature') | float(24) | round(1) }}
        perfil_fan: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','perfil_fan') }}
        perfil_alvo: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','perfil_target_temperature') }}
        distancia: |-
          {{ state_attr('sensor.elgin_supervisor_classificacao_do_estado_fisico','distancia_alvo') }}
        swing: |-
          {{ state_attr('sensor.elgin_supervisor_estado_fisico_observado','swing_normalizado') }}
        novo_ciclo: |-
          {% set segundos = as_timestamp(now()) - as_timestamp(states('input_datetime.elgin_supervisor_ultima_mudanca_power'),0) %}
          {{ power | bool and segundos >= 0 and segundos <= 10 }}
    - choose:
      - conditions:
        - condition: template
          value_template: |-
            {{ not (power | bool) }}
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.elgin_supervisor_estado_fisico_adotado
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_fisico_classificado
          data:
            option: Nenhum
        - action: input_select.select_option
          target:
            entity_id:
            - input_select.elgin_supervisor_potencia_fisica_classificada
            - input_select.elgin_supervisor_potencia_supervisor_na_adocao
          data:
            option: Nenhuma
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_ativo
          data:
            option: Nenhum
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
          data:
            value: Desligamento físico reconhecido como encerramento normal do ciclo.
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_decisao
          data:
            value: 'Físico semi-automático: aparelho desligado externamente; ciclo encerrado e tempo mínimo desligado preservado.'
      - conditions:
        - condition: template
          value_template: |-
            {{ tratamento in ['Aquecimento','Refrigeração','Desumidificação'] and potencia_fisica in ['Fraco','Normal','Forte','Extremo'] }}
        sequence:
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_fisico_classificado
          data:
            option: |-
              {{ tratamento }}
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_potencia_fisica_classificada
          data:
            option: |-
              {{ potencia_fisica }}
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_tratamento_ativo
          data:
            option: |-
              {{ tratamento }}
        - if:
          - condition: template
            value_template: |-
              {{ novo_ciclo | bool }}
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.elgin_supervisor_temperatura_na_ativacao
            data:
              value: |-
                {{ states('sensor.sensor_temperatura_sensor_dedicado') | float(20) | round(1) }}
          - action: input_number.set_value
            target:
              entity_id: input_number.elgin_supervisor_umidade_na_ativacao
            data:
              value: |-
                {{ states('sensor.sensor_umidade_sensor_dedicado') | float(50) | round(0) | int }}
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.elgin_supervisor_inicio_do_ciclo
            data:
              datetime: |-
                {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
        - delay: 00:00:01
        - variables:
            potencia_supervisor: |-
              {% if tratamento == 'Aquecimento' %}{{ states('sensor.elgin_supervisor_potencia_efetiva_de_aquecimento') }}
              {% elif tratamento == 'Refrigeração' %}{{ states('sensor.elgin_supervisor_potencia_efetiva_de_refrigeracao') }}
              {% elif tratamento == 'Desumidificação' %}{{ states('sensor.elgin_supervisor_potencia_efetiva_de_desumidificacao') }}
              {% else %}Nenhuma{% endif %}
        - action: input_select.select_option
          target:
            entity_id: input_select.elgin_supervisor_potencia_supervisor_na_adocao
          data:
            option: |-
              {{ potencia_supervisor if potencia_supervisor in ['Fraco','Normal','Forte','Extremo'] else 'Nenhuma' }}
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.elgin_supervisor_estado_fisico_adotado
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
          data:
            value: |-
              {% set msg = tratamento ~ ' classificado como ' ~ potencia_fisica
                ~ ': recebido ' ~ mode ~ ' ' ~ alvo ~ '°C/' ~ fan
                ~ ', swing=' ~ swing ~ '; perfil=' ~ perfil_alvo ~ '°C/' ~ perfil_fan
                ~ ', distância=' ~ distancia ~ '°C; Supervisor na adoção=' ~ potencia_supervisor ~ '.' %}
              {{ msg | string | truncate(255,true,'') }}
        - action: input_text.set_value
          target:
            entity_id: input_text.elgin_supervisor_ultima_decisao
          data:
            value: |-
              {% set msg = 'Físico semi-automático: ' ~ tratamento ~ '/' ~ potencia_fisica
                ~ ' adotado sem IR; mantidos ' ~ alvo ~ '°C/' ~ fan ~ ', swing=' ~ swing
                ~ '; Supervisor na adoção=' ~ potencia_supervisor ~ '. A próxima mudança de potência reassumirá o perfil automático.' %}
              {{ msg | string | truncate(255,true,'') }}
      default:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.elgin_supervisor_estado_fisico_adotado
      - action: input_select.select_option
        target:
          entity_id: input_select.elgin_supervisor_tratamento_fisico_classificado
        data:
          option: Não supervisionado
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.elgin_supervisor_potencia_fisica_classificada
          - input_select.elgin_supervisor_potencia_supervisor_na_adocao
        data:
          option: Nenhuma
      - action: input_select.select_option
        target:
          entity_id: input_select.elgin_supervisor_tratamento_ativo
        data:
          option: Manual
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_classificacao_fisica
        data:
          value: |-
            Modo físico {{ mode }} preservado sem pausa, mas sem perfil supervisionado de potência.
      - action: input_text.set_value
        target:
          entity_id: input_text.elgin_supervisor_ultima_decisao
        data:
          value: |-
            Físico semi-automático: modo {{ mode }} não possui ciclo supervisionado; estado externo preservado sem IR até novo comando suportado ou desligamento.
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.elgin_supervisor_ultima_classificacao_fisica
      data:
        datetime: |-
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
  elgin_supervisor_reclassificar_estado_fisico:
    alias: Elgin Supervisor - Reclassificar estado físico
    icon: mdi:refresh-auto
    mode: restart
    sequence:
    - condition: state
      entity_id: binary_sensor.elgin_supervisor_fisico_semiautomatico_efetivo
      state: 'on'
    - action: timer.cancel
      target:
        entity_id: timer.elgin_supervisor_classificacao_fisica
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.elgin_supervisor_processando_comando_fisico
    - action: script.elgin_supervisor_adotar_estado_fisico
automation:
- id: elgin_supervisor_v1_inicializar
  alias: Elgin Supervisor - Inicializar configuração
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:05
  - action: input_text.set_value
    target:
      entity_id: input_text.elgin_supervisor_assinatura_ultimo_ir
    data:
      value: ''
  - if:
    - condition: state
      entity_id: input_boolean.elgin_supervisor_configurado
      state: 'off'
    then:
    - variables:
        numeros:
          input_number.elgin_supervisor_aquecimento_inicio: 18.0
          input_number.elgin_supervisor_aquecimento_fim: 20.2
          input_number.elgin_supervisor_refrigeracao_inicio: 25.2
          input_number.elgin_supervisor_refrigeracao_fim: 22.7
          input_number.elgin_supervisor_desumidificacao_inicio: 63
          input_number.elgin_supervisor_desumidificacao_fim: 57
