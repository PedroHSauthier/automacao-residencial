      fonte_ifeel: "{{ states('sensor.elgin_supervisor_fonte_ifeel_efetiva') }}"
      potencia_diagnostico: "{{ state_attr('sensor.elgin_supervisor_potencias','modes') }}"
      origem_configuracao: "{{ 'Estado físico adotado' if is_state('binary_sensor.elgin_supervisor_preservar_estado_fisico_adotado','on') else 'Perfil dinâmico do Supervisor' }}"
      turbo: "{{ is_state('binary_sensor.elgin_supervisor_turbo_efetivo','on') }}"
      sleep: "{{ is_state('binary_sensor.elgin_supervisor_sleep_efetivo','on') }}"
      health: "{{ is_state('binary_sensor.elgin_supervisor_health_efetivo','on') }}"
      politica_temporal: "{{ states('sensor.elgin_supervisor_politica_temporal_efetiva') }}"
      snapshot_revision: "{{ state_attr('sensor.elgin_supervisor_potencias','snapshot_revision') }}"
      evaluation_id: "{{ state_attr('sensor.elgin_supervisor_potencias','evaluation_id') }}"
      integridade_pipeline: "{{ state_attr('sensor.elgin_supervisor_potencias','integrity') }}"
      preset_snapshot_revision: "{{ state_attr('sensor.elgin_supervisor_presets_de_condicao','snapshot_revision') }}"
      policy_snapshot_revision: "{{ state_attr('sensor.elgin_supervisor_agenda_politica','snapshot_revision') }}"
  - name: Elgin Supervisor - Estado operacional
